# On a version tag (e.g. 1.0.0), attaches one zip per skill to a GitHub release, for claude.ai uploads.
name: Release skills

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skills
        run: python3 scripts/check-skills.py
      - name: Package skills
        run: sh scripts/package-skills.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "Chenile skills ${GITHUB_REF_NAME}" --generate-notes
